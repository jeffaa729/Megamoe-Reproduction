[project]
name = "megamoe-h200"
version = "0.1.0"
description = "BF16 Hopper MegaMoE kernels and distributed benchmarks"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "packaging>=24.2",
    "torch==2.13.0",
    "nvidia-nccl-cu13==2.30.4",
    "nvidia-nvshmem-cu13==3.4.5",
]

[dependency-groups]
dev = ["ninja", "setuptools>=70.1", "wheel"]

[tool.uv]
# DeepEP V2 needs NCCL 2.30.4; the PyTorch wheel pins an older release.
override-dependencies = ["nvidia-nccl-cu13==2.30.4"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
